[project]
name = "ai-support-ticket-classification"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.100.0",
    "uvicorn[standard]==0.23.2",
    "SQLAlchemy==1.4.54",
    "pydantic==2.6.2",
    "python-multipart==0.0.6",
    "joblib==1.3.2",
    "pandas==2.2.3",
    "scikit-learn==1.3.2",
    "python-dotenv==1.0.0",
    "email-validator==2.2.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
